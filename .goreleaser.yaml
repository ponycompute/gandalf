version: 2

project_name: gandalf

# The runtime uses the macOS keychain and launchd, so only darwin is built.
builds:
  - id: gandalf
    builder: rust
    binary: gandalf
    tool: cargo
    command: build
    targets:
      - aarch64-apple-darwin
      - x86_64-apple-darwin
    flags:
      - --release
      - --locked
      - --package=gandalf-cli

archives:
  - id: gandalf
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
