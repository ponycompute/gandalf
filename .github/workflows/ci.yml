name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.15.2"
          args: check

      - name: Monorepo Typecheck & Build (Turbo)
        run: |
          bun run typecheck
          bun run build

      - name: Monorepo Tests (Go + Apps)
        run: bun run test

      - name: Install script smoke
        run: ./scripts/install-smoke.sh
