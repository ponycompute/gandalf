[workspace]
resolver = "3"
members = ["crates/*", "tools/gandalf-release-gate"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/ponycompute/gandalf"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
gandalf-adapters = { path = "crates/gandalf-adapters" }
gandalf-core = { path = "crates/gandalf-core" }
gandalf-distill = { path = "crates/gandalf-distill" }
gandalf-ingest = { path = "crates/gandalf-ingest" }
gandalf-service = { path = "crates/gandalf-service" }
gandalf-skills = { path = "crates/gandalf-skills" }
gandalf-store = { path = "crates/gandalf-store" }
gandalf-workgraph = { path = "crates/gandalf-workgraph" }
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom", "zeroize"] }
clap = { version = "4.6.2", features = ["derive", "env"] }
crossterm = "0.29"
futures = "0.3"
hdrhistogram = "7"
insta = "1"
interprocess = { version = "2.4.2", features = ["tokio"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
notify = "8.2.0"
plist = "1"
proptest = "1"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled", "time", "uuid"] }
rustix = { version = "1", features = ["fs", "process"] }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
struson = "0.7.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.52.4", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }
